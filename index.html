<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی کانتکت (Contact)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #ec4899;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Vazirmatn', sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    header { text-align: center; margin-bottom: 0.5rem; }
    header h1 { font-size: 1.8rem; color: #fff; margin-bottom: 0.25rem; }
    header p { color: var(--text-muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .hidden { display: none !important; }
    input, button {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--card-border);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    input {
      background: #0b1120;
      color: var(--text);
      margin-bottom: 0.75rem;
    }
    input:focus { border-color: var(--primary); }
    button {
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-bottom: 0.5rem;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.danger { background: var(--danger); }
    button.accent { background: var(--accent); }
    .letter-board {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .letter-box {
      width: 44px;
      height: 48px;
      background: #0b1120;
      border: 2px solid var(--primary);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .letter-box.empty { border-color: var(--card-border); color: var(--text-muted); }
    .countdown-bar {
      height: 6px;
      background: var(--card-border);
      border-radius: 3px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .countdown-fill {
      height: 100%;
      background: var(--accent);
      width: 100%;
      transition: width 0.1s linear;
    }
    .players-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .badge {
      background: #0b1120;
      padding: 0.25rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      border: 1px solid var(--card-border);
    }
    .badge.host { border-color: var(--warning); color: var(--warning); }
    .badge.me { border-color: var(--primary); color: #818cf8; }
    .log-box {
      background: #0b1120;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.85rem;
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .log-entry { color: var(--text-muted); }
    .log-entry.system { color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>بازی کانتکت 💬</h1>
    <p>بازی واژه‌یابی تیمی و تلپاتی کلمات</p>
  </header>

  <!-- کارت عضویت / ساخت اتاق -->
  <div id="authCard" class="card">
    <h2 style="font-size:1.2rem; margin-bottom:1rem;">ورود به بازی</h2>
    <input type="text" id="playerName" placeholder="نام شما (مثلاً: رضا)">
    <button onclick="createRoom()">➕ ساخت اتاق جدید</button>
    <div style="text-align:center; margin:0.5rem 0; color:var(--text-muted);">یا</div>
    <input type="text" id="roomCodeInput" placeholder="کد ۴ حرفی اتاق" style="text-transform:uppercase;">
    <button class="secondary" onclick="joinRoom()">🚪 ورود به اتاق</button>
  </div>

  <!-- کارت بازی اصلی -->
  <div id="gameCard" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>کد اتاق: <strong id="displayRoomCode" style="color:var(--primary); font-size:1.2rem;">----</strong></span>
      <span id="roleBadge" class="badge">نقش: بازیکن</span>
    </div>

    <!-- حروف کشف‌شده کلمه -->
    <div class="letter-board" id="lettersContainer"></div>

    <!-- تایمر شمارش معکوس کانتکت -->
    <div id="countdownBox" class="hidden">
      <div style="text-align:center; color:var(--accent); font-weight:bold; margin-bottom:0.25rem;">
        ⏳ کانکت برقرار شد! شمارش ۵ ثانیه‌ای...
      </div>
      <div class="countdown-bar">
        <div id="countdownBar" class="countdown-fill"></div>
      </div>
    </div>

    <!-- کنترل‌های اختصاصی میزبان -->
    <div id="hostControls" class="hidden" style="margin-top:1rem; border-top:1px solid var(--card-border); padding-top:1rem;">
      <h3 style="font-size:1rem; margin-bottom:0.5rem; color:var(--warning);">تنظیمات میزبان</h3>
      <div id="secretWordSection">
        <input type="text" id="secretWordInput" placeholder="کلمه مخفی نهایی را وارد کنید">
        <button onclick="setSecretWord()">ثبت کلمه مخفی و شروع</button>
      </div>
      <div id="hostDisconnectSection" class="hidden" style="margin-top:0.5rem;">
        <input type="text" id="hostGuessInput" placeholder="حدس برای دیس‌کانتکت کردن راهنمایی">
        <button class="danger" onclick="disconnectGuess()">🚫 دیس‌کانتکت (حدس کلمه)</button>
      </div>
    </div>

    <!-- بخش راهنمایی و کانکت شدن (برای بازیکنان) -->
    <div id="playerControls" class="hidden" style="margin-top:1rem; border-top:1px solid var(--card-border); padding-top:1rem;">
      <!-- ارسال راهنمایی جدید -->
      <div id="clueCreateSection">
        <h3 style="font-size:1rem; margin-bottom:0.5rem;">ارسال راهنمایی</h3>
        <input type="text" id="clueTextInput" placeholder="راهنمایی (مثال: حیوانی بارکش)">
        <input type="text" id="underlyingWordInput" placeholder="کلمه مد نظرتان (مثال: خر)">
        <button onclick="postClue()">ارسال راهنمایی</button>
      </div>

      <!-- راهنمایی فعال روی میز -->
      <div id="activeClueSection" class="hidden" style="background:#0b1120; padding:0.75rem; border-radius:0.5rem; margin-top:0.75rem;">
        <p style="font-size:0.9rem; color:var(--text-muted);">راهنمایی از طرف <span id="clueAuthor" style="color:#fff;"></span>:</p>
        <p id="clueTextDisplay" style="font-size:1.1rem; font-weight:bold; margin:0.5rem 0; color:#38bdf8;"></p>
        <button id="connectBtn" class="accent" onclick="connectToClue()">⚡ کانکت شدم! (منم فهمیدم)</button>
      </div>

      <!-- آشکارسازی نهایی کلمه (در پایان ۵ ثانیه) -->
      <div id="submitWordSection" class="hidden" style="margin-top:0.75rem;">
        <p style="color:var(--success); font-size:0.9rem; margin-bottom:0.5rem;">کلمه مد نظر خود را تایپ و ارسال کنید:</p>
        <input type="text" id="revealWordInput" placeholder="کلمه شما">
        <button class="accent" onclick="submitRevealWord()">ارسال کلمه</button>
      </div>
    </div>

    <!-- لیست بازیکنان -->
    <div style="margin-top:1rem;">
      <div style="font-size:0.85rem; color:var(--text-muted);">بازیکنان حاضر:</div>
      <div class="players-list" id="playersList"></div>
    </div>
  </div>

  <!-- لاگ پیام‌های بازی -->
  <div class="card">
    <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.4rem;">رویدادهای بازی:</div>
    <div class="log-box" id="logBox">
      <div class="log-entry system">به بازی خوش آمدید.</div>
    </div>
  </div>
</div>

<script>
(() => {
  let ws = null;
  let myId = null;
  let myRoomCode = null;
  let currentState = null;
  let countdownTimer = null;

  function connectSocket() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'room_created' || msg.type === 'joined') {
        myId = msg.myId;
        myRoomCode = msg.code;
        document.getElementById('authCard').classList.add('hidden');
        document.getElementById('gameCard').classList.remove('hidden');
        document.getElementById('displayRoomCode').innerText = myRoomCode;
      } else if (msg.type === 'state') {
        currentState = msg.state;
        render(currentState);
      } else if (msg.type === 'system') {
        addLog(msg.message, true);
      } else if (msg.type === 'error') {
        alert(msg.message);
      } else if (msg.type === 'host_assigned') {
        addLog('شما اکنون میزبان بازی هستید!', true);
      }
    };

    ws.onclose = () => {
      addLog('ارتباط با سرور قطع شد. در حال تلاش برای اتصال مجدد...', true);
      setTimeout(connectSocket, 2000);
    };
  }

  connectSocket();

  function send(data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(data));
    }
  }

  window.createRoom = () => {
    const name = document.getElementById('playerName').value.trim();
    if (!name) return alert('لطفاً نام خود را بنویسید.');
    send({ action: 'create_room', name });
  };

  window.joinRoom = () => {
    const name = document.getElementById('playerName').value.trim();
    const code = document.getElementById('roomCodeInput').value.trim();
    if (!name || !code) return alert('لطفاً نام و کد اتاق را بنویسید.');
    send({ action: 'join_room', name, code });
  };

  window.setSecretWord = () => {
    const word = document.getElementById('secretWordInput').value.trim();
    if (!word) return alert('لطفاً کلمه را وارد کنید.');
    send({ action: 'set_secret', word });
    send({ action: 'start_game' });
  };

  window.postClue = () => {
    const clueText = document.getElementById('clueTextInput').value.trim();
    const underlyingWord = document.getElementById('underlyingWordInput').value.trim();
    if (!clueText) return alert('متن راهنمایی را بنویسید.');
    send({ action: 'post_clue', clueText, underlyingWord });
    document.getElementById('clueTextInput').value = '';
    document.getElementById('underlyingWordInput').value = '';
  };

  window.connectToClue = () => {
    send({ action: 'connect' });
  };

  window.disconnectGuess = () => {
    const guess = document.getElementById('hostGuessInput').value.trim();
    if (!guess) return alert('حدس خود را وارد کنید.');
    send({ action: 'disconnect_guess', guess });
    document.getElementById('hostGuessInput').value = '';
  };

  window.submitRevealWord = () => {
    const word = document.getElementById('revealWordInput').value.trim();
    if (!word) return alert('کلمه را تایپ کنید.');
    send({ action: 'submit_word', word });
    document.getElementById('revealWordInput').value = '';
  };

  function addLog(text, isSystem = false) {
    const box = document.getElementById('logBox');
    const el = document.createElement('div');
    el.className = 'log-entry' + (isSystem ? ' system' : '');
    el.innerText = text;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function render(state) {
    const isHost = state.hostId === myId;
    const roleBadge = document.getElementById('roleBadge');
    roleBadge.innerText = isHost ? '👑 شما میزبان هستید' : '🎮 شما بازیکن هستید';
    roleBadge.className = 'badge ' + (isHost ? 'host' : 'me');

    // حروف آشکار شده
    const lettersContainer = document.getElementById('lettersContainer');
    lettersContainer.innerHTML = '';
    const letters = state.revealedLetters ? state.revealedLetters.split('') : [];
    letters.forEach(char => {
      const box = document.createElement('div');
      box.className = 'letter-box';
      box.innerText = char;
      lettersContainer.appendChild(box);
    });

    // پنل‌ها
    const hostControls = document.getElementById('hostControls');
    const playerControls = document.getElementById('playerControls');
    const secretWordSection = document.getElementById('secretWordSection');
    const hostDisconnectSection = document.getElementById('hostDisconnectSection');

    if (isHost) {
      hostControls.classList.remove('hidden');
      playerControls.classList.add('hidden');
      secretWordSection.classList.toggle('hidden', state.phase !== 'lobby' && !!state.hostSecret);
      hostDisconnectSection.classList.toggle('hidden', !state.currentClue);
    } else {
      hostControls.classList.add('hidden');
      playerControls.classList.remove('hidden');
    }

    // راهنمایی فعال
    const activeClueSection = document.getElementById('activeClueSection');
    const clueCreateSection = document.getElementById('clueCreateSection');
    const submitWordSection = document.getElementById('submitWordSection');

    if (state.currentClue) {
      activeClueSection.classList.remove('hidden');
      clueCreateSection.classList.add('hidden');
      document.getElementById('clueAuthor').innerText = state.currentClue.authorName;
      document.getElementById('clueTextDisplay').innerText = state.currentClue.clueText;
      document.getElementById('connectBtn').classList.toggle('hidden', state.currentClue.authorId === myId || !!state.currentClue.connectorId);
    } else {
      activeClueSection.classList.add('hidden');
      clueCreateSection.classList.remove('hidden');
    }

    // ثبت کلمه (Submit phase)
    if (state.phase === 'submit' && state.currentClue) {
      const amIInvolved = state.currentClue.authorId === myId || state.currentClue.connectorId === myId;
      submitWordSection.classList.toggle('hidden', !amIInvolved);
    } else {
      submitWordSection.classList.add('hidden');
    }

    // تایمر ۵ ثانیه‌ای
    const countdownBox = document.getElementById('countdownBox');
    if (state.phase === 'countdown' && state.countdownEndsAt) {
      countdownBox.classList.remove('hidden');
      if (countdownTimer) clearInterval(countdownTimer);
      const endsAt = state.countdownEndsAt;
      countdownTimer = setInterval(() => {
        const remaining = Math.max(0, endsAt - Date.now());
        const pct = (remaining / 5000) * 100;
        document.getElementById('countdownBar').style.width = pct + '%';
        if (remaining <= 0) clearInterval(countdownTimer);
      }, 50);
    } else {
      countdownBox.classList.add('hidden');
      if (countdownTimer) clearInterval(countdownTimer);
    }

    // لیست بازیکنان
    const playersList = document.getElementById('playersList');
    playersList.innerHTML = '';
    state.players.forEach(p => {
      const badge = document.createElement('span');
      badge.className = 'badge' + (p.isHost ? ' host' : '') + (p.id === myId ? ' me' : '');
      badge.innerText = p.name + (p.isHost ? ' (میزبان)' : '') + (p.id === myId ? ' [شما]' : '');
      playersList.appendChild(badge);
    });
  }
})();
</script>
</body>
</html>
